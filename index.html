<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0614">
<title>Одно касание</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css">
</head>
<body oncontextmenu="return false">
<main id="app">
  <section id="screen-menu" class="screen active">
    <canvas id="menu-bg" aria-hidden="true"></canvas>
    <div class="menu-top">
      <span class="chip" id="chip-stars">★ 0</span>
      <span class="chip" id="chip-prog">0 / 60</span>
    </div>
    <h1 class="neon-title"><span data-i18n="title1">ОДНО</span><span data-i18n="title2">КАСАНИЕ</span></h1>
    <p class="tag" data-i18n="tag">Один выстрел. Все точки.</p>
    <button id="btn-play" class="play-orb" aria-label="Играть">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
      <span id="play-level">Уровень 1</span>
    </button>
    <button id="btn-daily" class="daily-card">
      <svg class="daily-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
      <span class="daily-text"><b data-i18n="daily">Уровень дня</b><small id="daily-sub"></small></span>
      <span class="daily-go" aria-hidden="true">›</span>
    </button>
    <nav class="icon-row">
      <button id="btn-levels" class="round" data-i18n-aria="levels" aria-label="Уровни"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/></svg></button>
      <button id="btn-sound" class="round" data-i18n-aria="sound" aria-label="Звук"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h4l5-4v13l-5-4H4z"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="slash" d="M3 3l18 18"/></svg></button>
      <button id="btn-music" class="round" data-i18n-aria="music" aria-label="Музыка"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5.5l11-2V16"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/><path class="slash" d="M3 3l18 18"/></svg></button>
    </nav>
  </section>

  <section id="screen-levels" class="screen">
    <header class="bar"><button id="levels-back" class="icon" data-i18n-aria="back" aria-label="Назад">&#8592;</button><span class="title" data-i18n="levels">Уровни</span><span></span></header>
    <div id="level-grid" class="levels"></div>
  </section>

  <section id="screen-game" class="screen">
    <header class="bar">
      <button id="game-back" class="icon" data-i18n-aria="back" aria-label="Назад">&#8592;</button>
      <span class="title" id="hud-level">Уровень 1</span>
      <span class="meta" id="hud-meta"></span>
    </header>
    <div id="stage"><canvas id="cv"></canvas></div>
    <div class="status" id="hud-status"></div>
    <footer class="controls">
      <button id="btn-minus" class="ctl" aria-label="◀">&#9664;</button>
      <button id="btn-fire" class="ctl fire" data-i18n="fire">Пуск</button>
      <button id="btn-plus" class="ctl" aria-label="▶">&#9654;</button>
      <button id="btn-hint" class="ctl hint" data-i18n="hint">Подсказка</button>
    </footer>
  </section>

  <div id="win" class="sheet-wrap hidden">
    <div class="sheet">
      <h2 id="win-title">Чисто!</h2>
      <p class="win-stars" id="win-stars"></p>
      <p class="win-info" id="win-info"></p>
      <div class="sheet-buttons">
        <button id="win-retry" class="ctl" data-i18n="retry">Ещё раз</button>
        <button id="win-next" class="ctl fire">Дальше</button>
      </div>
    </div>
  </div>
</main>
<script type="module" src="js/main.js"></script>
</body>
</html>
